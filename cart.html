
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | GL Bajaj Bookstore</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .quantity-control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .quantity-btn {
            width: 32px;
            height: 32px;
            border: 1px solid #4A172C;
            border-radius: 5px;
            background-color: #4A172C;
            color: #FFFFFF;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .quantity-btn:hover {
            background-color: #351020;
        }

        .quantity-value {
            min-width: 20px;
            text-align: center;
            font-weight: 600;
        }

        .remove,
        .clear {
            cursor: pointer;
        }
    </style>
</head>

<body>

<h2>Shopping Cart</h2>

<table>
    <thead>
        <tr>
            <th>Book</th>
            <th>Price</th>
            <th>Quantity</th>
            <th>Total</th>
            <th>Remove</th>
        </tr>
    </thead>

    <tbody id="cartItems"></tbody>

    <tfoot>
        <tr>
            <th colspan="3">Grand Total</th>
            <th colspan="2" id="grandTotal">RS.0</th>
        </tr>
    </tfoot>
</table>

<button class="clear" onclick="clearCart()">Clear Cart</button>

<script>
function showCart() {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    let cartItems = document.getElementById("cartItems");
    let grandTotal = 0;

    cartItems.innerHTML = "";

    if (cart.length === 0) {
        cartItems.innerHTML =
            '<tr><td colspan="5">Cart is Empty</td></tr>';

        document.getElementById("grandTotal").textContent = "RS.0";
        return;
    }

    cart.forEach(function(item, index) {
        let price = Number(item.price) || 0;
        let quantity = Math.max(1, Number(item.quantity) || 1);
        let total = price * quantity;

        grandTotal += total;

        cartItems.innerHTML += `
            <tr>
                <td>${item.name}</td>
                <td>RS.${price}</td>
                <td>
                    <div class="quantity-control">
                        <button type="button"
                                class="quantity-btn"
                                onclick="changeQuantity(${index}, -1)"
                                aria-label="Decrease quantity">−</button>

                        <span class="quantity-value">${quantity}</span>

                        <button type="button"
                                class="quantity-btn"
                                onclick="changeQuantity(${index}, 1)"
                                aria-label="Increase quantity">+</button>
                    </div>
                </td>
                <td>RS.${total}</td>
                <td>
                    <button type="button" class="remove"
                            onclick="removeItem(${index})">
                        Remove
                    </button>
                </td>
            </tr>
        `;
    });

    document.getElementById("grandTotal").textContent =
        "RS." + grandTotal;
}

function changeQuantity(index, change) {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    if (!cart[index]) {
        return;
    }

    let quantity = Number(cart[index].quantity) || 1;
    let newQuantity = quantity + change;

    if (newQuantity < 1) {
        return;
    }

    cart[index].quantity = newQuantity;

    localStorage.setItem("cart", JSON.stringify(cart));

    showCart();
}

function removeItem(index) {
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    cart.splice(index, 1);

    localStorage.setItem("cart", JSON.stringify(cart));

    showCart();
}

function clearCart() {
    localStorage.removeItem("cart");
    showCart();
}

showCart();
</script>

</body>
</html>
