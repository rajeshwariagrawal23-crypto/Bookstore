<!DOCTYPE html>
<html>

<head>
    <title>EEE Catalogue</title>
    <link rel="stylesheet" href="../style.css">
  

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        table {
            width: 90%;
            margin: 20px auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background-color: #f7b77f;
        }

        img {
            width: 80px;
            height: 100px;
        }
         button {
            background-color: #d7a717;
            border: 1px solid #555;
            padding: 8px 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0f5f5d;
        }
        /* ===== GL BAJAJ BOOKSTORE THEME ===== */

body {
    background-color: #F8F5EF;
    color: #292521;
    font-family: "Segoe UI", Arial, sans-serif;
}

h1, h2, h3 {
    color: #4A172C;
    text-align: center;
}

table {
    background-color: #FFFFFF;
    border-color: #E9E2D7;
}

th {
    background-color: #4A172C;
    color: #FFFFFF;
}

td {
    color: #292521;
    border-color: #E9E2D7;
}

button,
input[type="submit"],
input[type="button"] {
    background-color: #4A172C;
    color: #FFFFFF;
    border: 1px solid #4A172C;
    border-radius: 6px;
    padding: 9px 15px;
    cursor: pointer;
}

button:hover,
input[type="submit"]:hover,
input[type="button"]:hover {
    background-color: #351020;
    color: #D4B477;
}

a {
    color: #4A172C;
}

a:hover {
    color: #351020;
}

input, select, textarea {
    border: 1px solid #E9E2D7;
    border-radius: 5px;
    padding: 9px;
}
    </style>

</head>

<body>

<h2>EEE BOOK CATALOGUE</h2>

<table>

    <tr>
        <th>Book</th>
        <th>Author</th>
        <th>Publisher</th>
        <th>Price</th>
        <th>Cart</th>
    </tr>

    <tr>
        <td>
            <img src="https://technicalpublications.in/cdn/shop/products/9789333220392_7.jpg?v=1655496248">
            <br>BASIC ELECTRICAL ENGINEERING
        </td>

        <td>U.A BAKSHI</td>

        <td>TECHNICAL PUBLICATIONS</td>

        <td>RS.285</td>

        <td>
            <button onclick="addToCart('BASIC ELECTRICAL ENGINEERING', 285)">
    Add to Cart
</button>
        </td>
    </tr>

    <tr>
        <td>
            <img src="https://cbspd.s3.ap-south-1.amazonaws.com/assets/images/VasOXXvSLF5LsVl15MhE1732859138.jpg">
            <br>ELECTRICAL MACHINE DESIGN
        </td>

        <td>A.NAGOOR KANI</td>

        <td>CBS PUBLICATIONS</td>

        <td>RS.396</td>

        <td>
            <button onclick="addToCart('ELECTRICAL MACHINE DESIGN', 396)">
    Add to Cart
</button>
        </td>
    </tr>

</table>
<script>

function addToCart(name, price) {

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    let existing = cart.find(function(item) {
        return item.name === name;
    });

    if (existing) {
        existing.quantity++;
    } 
    else {
        cart.push({
            name: name,
            price: price,
            quantity: 1
        });
    }

    localStorage.setItem("cart", JSON.stringify(cart));

    alert(name + " added to cart!");
}

</script>

</body>

</html>
