
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | GL Bajaj Bookstore</title>

    <style>
        :root {
            --maroon: #4A172C;
            --dark-maroon: #351020;
            --gold: #D4B477;
            --cream: #F8F5EF;
            --white: #FFFFFF;
            --text: #292521;
            --border: #E9E2D7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--cream);
            color: var(--text);
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--maroon);
            color: var(--white);
            text-align: center;
            padding: 24px 16px;
            border-bottom: 4px solid var(--gold);
        }

        header h1 {
            font-size: 28px;
            margin-bottom: 6px;
        }

        header p {
            font-size: 14px;
            color: #F1E7D5;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px 16px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: var(--white);
            padding: 32px;
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(53, 16, 32, 0.10);
        }

        .login-card h2 {
            color: var(--maroon);
            text-align: center;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #716963;
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--dark-maroon);
        }

        input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #D8CEC2;
            border-radius: 6px;
            font-size: 15px;
            background: #FFFEFC;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--maroon);
            box-shadow: 0 0 0 3px rgba(74, 23, 44, 0.10);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 70px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: var(--maroon);
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin: 3px 0 22px;
            font-size: 13px;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #625A54;
        }

        .remember input {
            width: 15px;
            height: 15px;
            accent-color: var(--maroon);
        }

        a {
            color: var(--maroon);
            font-weight: 600;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            background: var(--maroon);
            color: var(--white);
            border: 2px solid var(--maroon);
            border-radius: 6px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .login-button:hover {
            background: var(--dark-maroon);
        }

        .message {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            background: #FFF0F0;
            color: #9B1C1C;
            border: 1px solid #F1CACA;
        }

        .message.success {
            display: block;
            background: #F2F8F0;
            color: #285D2A;
            border: 1px solid #CDE4C9;
        }

        .register-text {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #625A54;
        }

        footer {
            background: var(--dark-maroon);
            color: #F1E7D5;
            text-align: center;
            padding: 15px;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            header h1 {
                font-size: 23px;
            }

            .login-card {
                padding: 24px 20px;
            }

            .options {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>GL BAJAJ BOOKSTORE</h1>
        <p>Your academic companion, all in one place</p>
    </header>

    <main>
        <section class="login-card">
            <h2>Welcome Back!</h2>
            <p class="subtitle">
                Log in to access your bookstore account.
            </p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your registered email"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                        <button
                            type="button"
                            class="toggle-password"
                            id="togglePassword"
                            aria-label="Show password"
                        >SHOW</button>
                    </div>
                </div>

                <div class="options">
                    <label class="remember">
                        <input type="checkbox" id="remember">
                        Remember me
                    </label>

                    <a href="#" id="forgotPassword">Forgot password?</a>
                </div>

                <button type="submit" class="login-button">
                    LOGIN
                </button>

                <div id="message" class="message" role="status"
                     aria-live="polite"></div>
            </form>

            <p class="register-text">
                Don't have an account?
                <a href="registration.html">Register here</a>
            </p>
        </section>
    </main>

    <footer>
        GL Bajaj Bookstore | Learn, Explore, Achieve
    </footer>

    <script>
        const loginForm = document.getElementById("loginForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");
        const message = document.getElementById("message");

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "message " + type;
        }

        togglePassword.addEventListener("click", function () {
            const isHidden = passwordInput.type === "password";

            passwordInput.type = isHidden ? "text" : "password";
            togglePassword.textContent = isHidden ? "HIDE" : "SHOW";
            togglePassword.setAttribute(
                "aria-label",
                isHidden ? "Hide password" : "Show password"
            );
        });

        loginForm.addEventListener("submit", function (event) {
            event.preventDefault();

            if (!loginForm.checkValidity()) {
                loginForm.reportValidity();
                return;
            }

            if (!emailInput.value.trim() || !passwordInput.value) {
                showMessage(
                    "Please enter your email address and password.",
                    "error"
                );
                return;
            }

            showMessage(
                "Your details have been entered. Actual login requires " +
                "connection to your authentication system.",
                "success"
            );
        });

        document.getElementById("forgotPassword")
            .addEventListener("click", function (event) {
                event.preventDefault();

                showMessage(
                    "Password recovery is not connected yet. " +
                    "Please contact the bookstore administrator.",
                    "error"
                );
            });
    </script>

</body>
</html>
